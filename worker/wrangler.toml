name = "aegis-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# 环境变量（在 [vars] 中设置非敏感值）
# ============================================================
[vars]
MODEL_PROVIDER = "deepseek"       # "deepseek" 或 "gemini"

# ============================================================
# 敏感密钥（使用 wrangler secret put 设置，不要明文写在此处）
# ============================================================
# wrangler secret put DEEPSEEK_API_KEY    # DeepSeek API 密钥
# wrangler secret put GEMINI_API_KEY      # Gemini API 密钥（可选）
# wrangler secret put AUTH_TOKEN          # 核心鉴权令牌（前后端必须一致）
# wrangler secret put ALLOWED_ORIGIN      # 允许的前端域名，如 https://xxx.pages.dev
# wrangler secret put EXPECTED_CLIENT_ID  # 客户端环境指纹令牌（可选增强）

# ============================================================
# 可选：Cloudflare Rate Limiting（在 Dashboard 配置）
# 建议：每个 IP 每分钟最多 10 次请求
# ============================================================
# [[r2_buckets]]  # 如需扩展存储
# binding = "AEGIS_KV"
# id = "your-kv-id"
